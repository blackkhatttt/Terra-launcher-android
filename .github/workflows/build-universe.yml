name: Build Universe Launcher 0.7 - SolarCrystal 0.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - solarcrystal-0.7

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10.2'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build Universe Launcher 0.7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SolarCrystal 0.6 baseline and apply 0.7 patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP="$GITHUB_WORKSPACE/UniverseLauncher-0.6-SolarCrystal-0.6.zip"
          PATCH_B64="$GITHUB_WORKSPACE/SolarCrystal-0.7.patch.gz.b64"
          test -f "$BASE_ZIP"
          test -f "$PATCH_B64"
          EXTRACT_DIR="$RUNNER_TEMP/universe-07-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$BASE_ZIP" -d "$EXTRACT_DIR"
          base64 --decode "$PATCH_B64" > "$RUNNER_TEMP/solarcrystal-0.7.patch.gz"
          gzip -dc "$RUNNER_TEMP/solarcrystal-0.7.patch.gz" | patch --batch -p1 -d "$EXTRACT_DIR"
          PROJECT_DIR="$EXTRACT_DIR/uc02"
          test -f "$PROJECT_DIR/terra-android/src/main/cpp/class_registry.cpp"
          test -f "$PROJECT_DIR/terra-android/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Prepared SolarCrystal 0.7 project: $PROJECT_DIR"

      - name: Validate SolarCrystal 0.7 sources and preserved tests
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/terra-android/src/main/cpp"
          JAVA="$PROJECT_DIR/terra-android/src/main/java"
          grep -q 'VERSION 0.7.0' "$CPP/CMakeLists.txt"
          grep -q 'class_registry.cpp' "$CPP/CMakeLists.txt"
          grep -q 'nativeLoadClass' "$JAVA/com/universe/solarcrystal/NativeBridge.java"
          grep -q 'nativeResolveClass' "$JAVA/com/universe/solarcrystal/NativeBridge.java"
          grep -q 'nativeResolveMethod' "$JAVA/com/universe/solarcrystal/NativeBridge.java"
          grep -q "versionCode 7" "$PROJECT_DIR/terra-android/build.gradle"
          grep -q "versionName '0.7.0'" "$PROJECT_DIR/terra-android/build.gradle"
          grep -q 'TEST SOLARCRYSTAL CLASS READER' "$JAVA/com/terra/android/MainActivity.java"
          grep -q 'TEST SOLARCRYSTAL BYTECODE VM' "$JAVA/com/terra/android/MainActivity.java"
          grep -q 'TEST SOLARCRYSTAL .CLASS EXECUTION' "$JAVA/com/terra/android/MainActivity.java"
          grep -q 'TEST SOLARCRYSTAL METHOD PARAMETERS' "$JAVA/com/terra/android/MainActivity.java"
          grep -q 'TEST SOLARCRYSTAL INTEGER MULTIPLICATION' "$JAVA/com/terra/android/MainActivity.java"
          grep -q 'TEST SOLARCRYSTAL CLASS LOADING' "$JAVA/com/terra/android/MainActivity.java"
          echo "SolarCrystal 0.7 source validation passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Clean native build directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/terra-android/.cxx"
          rm -rf "$PROJECT_DIR/terra-android/build"
          rm -rf "$PROJECT_DIR/terra-android/.externalNativeBuild"
          rm -rf "$PROJECT_DIR/terra-core/build"

      - name: Normalize source timestamps
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -not -path '*/.git/*' -exec touch {} +

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" \
            :terra-android:clean :terra-android:assembleDebug

      - name: Verify APK and all four native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APK_DIR="$RUNNER_TEMP/universe-apk-check"
          mkdir -p "$APK_DIR"
          unzip -q "$APK" -d "$APK_DIR"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "$APK_DIR/lib/$ABI/libsolarcrystal.so"
            echo "OK: $ABI"
          done
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK verified: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.7-SolarCrystal-0.7-Android
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
