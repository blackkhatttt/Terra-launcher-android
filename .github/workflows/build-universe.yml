
name: Build Universe Launcher 0.6 - SolarCrystal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10.2'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate SolarCrystal 0.6 project
        id: locate
        shell: bash
        run: |
          set -e

          find_project() {
            local root="$1"

            while IFS= read -r settings; do
              local dir
              dir="$(dirname "$settings")"

              if [ -f "$dir/terra-android/build.gradle" ] &&
                 [ -f "$dir/terra-core/build.gradle" ] &&
                 [ -f "$dir/terra-android/src/main/cpp/CMakeLists.txt" ] &&
                 [ -f "$dir/terra-android/src/main/cpp/class_method_executor.cpp" ]; then
                echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
                echo "Found project: $dir"
                return 0
              fi
            done < <(find "$root" -name settings.gradle -type f)

            return 1
          }

          if find_project "$GITHUB_WORKSPACE"; then
            exit 0
          fi

          ZIP_FILE="$GITHUB_WORKSPACE/UniverseLauncher-0.6-SolarCrystal-0.6.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el proyecto ni el ZIP 0.6."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/universe-06-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          if ! find_project "$EXTRACT_DIR"; then
            echo "ERROR: El ZIP no contiene un proyecto SolarCrystal válido."
            echo "Contenido del ZIP:"
            unzip -l "$ZIP_FILE"
            exit 1
          fi

      - name: Validate project files
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          FILES=(
            "terra-android/src/main/cpp/CMakeLists.txt"
            "terra-android/src/main/cpp/vm_runtime.cpp"
            "terra-android/src/main/cpp/class_method_executor.cpp"
            "terra-android/src/main/cpp/jni_bridge.cpp"
            "terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
            "terra-android/src/main/java/com/terra/android/MainActivity.java"
          )

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Falta $file"
              exit 1
            fi
            echo "OK: $file"
          done

          if ! grep -q "versionName" terra-android/build.gradle; then
            echo "ERROR: No se encontró versionName en build.gradle"
            exit 1
          fi

          echo "Version configuration:"
          grep -E "versionCode|versionName" terra-android/build.gradle || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Clean native build directories
        shell: bash
        run: |
          set -e

          echo "Removing previous native build files..."

          rm -rf "$PROJECT_DIR/terra-android/.cxx"
          rm -rf "$PROJECT_DIR/terra-android/build"
          rm -rf "$PROJECT_DIR/terra-android/.externalNativeBuild"
          rm -rf "$PROJECT_DIR/terra-core/build"

          echo "Native build directories cleaned."

      - name: Normalize source timestamps
        shell: bash
        run: |
          set -e

          echo "Normalizing source file timestamps..."

          find "$PROJECT_DIR" \
            -path "$PROJECT_DIR/.git" -prune -o \
            -type f -exec touch {} +

          echo "Source timestamps normalized."

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Universe Launcher
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :terra-android:assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK encontrado: $APK"

      - name: Verify SolarCrystal native libraries
        shell: bash
        run: |
          set -e

          APK_DIR="$RUNNER_TEMP/apk-check"
          mkdir -p "$APK_DIR"
          unzip -q "$APK_PATH" -d "$APK_DIR"

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            LIB="$APK_DIR/lib/$ABI/libsolarcrystal.so"

            if [ ! -f "$LIB" ]; then
              echo "ERROR: No existe libsolarcrystal.so para $ABI"
              exit 1
            fi

            echo "OK: $ABI"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Launcher-0.6-SolarCrystal
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
