
name: Build Universe Launcher 0.2 - SolarCrystal 0.2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Universe Launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate SolarCrystal 0.2 project
        shell: bash
        run: |
          set -euo pipefail

          is_solarcrystal_02_project() {
            local d="$1"
            [ -f "$d/settings.gradle" ] &&
            [ -f "$d/terra-android/build.gradle" ] &&
            [ -f "$d/terra-android/src/main/cpp/class_reader.cpp" ] &&
            [ -f "$d/terra-android/src/main/cpp/include/class_reader.h" ]
          }

          PROJECT_DIR=""

          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if is_solarcrystal_02_project "$candidate"; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -maxdepth 6 -name settings.gradle -not -path './.git/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Searching ZIP archives for SolarCrystal 0.2..."

            mkdir -p "$RUNNER_TEMP/universe-source"
            FOUND_ZIP=""

            while IFS= read -r archive; do
              if unzip -Z1 "$archive" | grep -qE '(^|/)terra-android/src/main/cpp/class_reader\.cpp$' &&
                 unzip -Z1 "$archive" | grep -qE '(^|/)terra-android/src/main/cpp/include/class_reader\.h$'; then
                FOUND_ZIP="$archive"
                break
              fi
            done < <(find . -maxdepth 3 -type f -name 'UniverseLauncher*.zip' | sort -r)

            if [ -z "$FOUND_ZIP" ]; then
              echo "::error::No ZIP containing the SolarCrystal 0.2 class reader was found."
              exit 1
            fi

            echo "Using archive: $FOUND_ZIP"
            unzip -q "$FOUND_ZIP" -d "$RUNNER_TEMP/universe-source"

            while IFS= read -r settings; do
              candidate="$(dirname "$settings")"
              if is_solarcrystal_02_project "$candidate"; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$RUNNER_TEMP/universe-source" -maxdepth 7 -name settings.gradle | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::SolarCrystal 0.2 project files are missing."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Selected project: $PROJECT_DIR"
          ls -l \
            "$PROJECT_DIR/terra-android/src/main/cpp/class_reader.cpp" \
            "$PROJECT_DIR/terra-android/src/main/cpp/include/class_reader.h"

      - name: Normalize source timestamps
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -exec touch {} +
          echo "Source timestamps normalized."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify SolarCrystal 0.2 native integration
        shell: bash
        run: |
          set -euo pipefail

          grep -q "class_reader.cpp" "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt"
          grep -q "nativeInspectClass" "$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
          grep -q "nativeInspectClass" "$PROJECT_DIR/terra-android/src/main/cpp/jni_bridge.cpp"

          echo "SolarCrystal 0.2 integration verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :terra-android:clean \
            :terra-android:assembleDebug

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "Generated APK: $APK"
          unzip -l "$APK" | grep 'libsolarcrystal.so'

          LIB_COUNT="$(unzip -l "$APK" | grep -cE 'lib/[^/]+/libsolarcrystal\.so$' || true)"
          if [ "$LIB_COUNT" -ne 4 ]; then
            echo "::error::Expected 4 native libraries, found $LIB_COUNT."
            exit 1
          fi

          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.2-SolarCrystal-0.2-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
