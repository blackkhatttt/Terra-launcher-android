name: Build Universe Launcher 0.5 - SolarCrystal Class VM

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Universe Launcher 0.5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate SolarCrystal 0.5 project (or extract its ZIP)
        shell: bash
        run: |
          set -euo pipefail
          find_project_05() {
            local f d
            while IFS= read -r f; do
              d="$(dirname "$f")"
              if [ -f "$d/terra-android/build.gradle" ] \
                && [ -f "$d/terra-android/src/main/cpp/class_method_executor.cpp" ] \
                && grep -q 'VERSION 0.5.0' "$d/terra-android/src/main/cpp/CMakeLists.txt"; then
                echo "$d"
                return 0
              fi
            done < <(find "$1" -maxdepth 6 -name settings.gradle -not -path '*/.git/*' | sort)
            return 1
          }

          if ! PROJECT_DIR="$(find_project_05 .)"; then
            ZIP_FILE="$(find . -maxdepth 5 -type f -name 'UniverseLauncher-0.5-SolarCrystal-0.5.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No SolarCrystal 0.5 project or matching ZIP was found."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/universe-05-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/universe-05-source"
            PROJECT_DIR="$(find_project_05 "$RUNNER_TEMP/universe-05-source")" || {
              echo "::error::The ZIP does not contain a valid SolarCrystal 0.5 project."
              exit 1
            }
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using SolarCrystal 0.5 project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Normalize source timestamps
        shell: bash
        run: find "$PROJECT_DIR" -type f -exec touch {} +

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify SolarCrystal 0.5 integration
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/terra-android/src/main/cpp"
          JAVA="$PROJECT_DIR/terra-android/src/main/java"
          grep -q 'VERSION 0.5.0' "$CPP/CMakeLists.txt"
          grep -q 'class_method_executor.cpp' "$CPP/CMakeLists.txt"
          grep -q 'nativeExecuteClassMethod' "$CPP/jni_bridge.cpp"
          grep -q 'nativeExecuteClassMethod' "$JAVA/com/universe/solarcrystal/NativeBridge.java"
          grep -q 'TEST SOLARCRYSTAL .CLASS EXECUTION' "$JAVA/com/terra/android/MainActivity.java"
          grep -q "versionName '0.5.0'" "$PROJECT_DIR/terra-android/build.gradle"
          echo 'SolarCrystal 0.5 sources verified.'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :terra-android:clean :terra-android:assembleDebug

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | grep 'libsolarcrystal.so'
          test "$(unzip -l "$APK" | grep -c 'lib/.*/libsolarcrystal.so')" -eq 4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.5-SolarCrystal-0.5-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
