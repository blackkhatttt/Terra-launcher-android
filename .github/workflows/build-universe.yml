
name: Build Universe Launcher 0.6 - SolarCrystal

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Universe Launcher 0.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract SolarCrystal 0.6
        shell: bash
        run: |
          set -euo pipefail

          find_project_06() {
            local root="$1"
            local f d

            while IFS= read -r f; do
              d="$(dirname "$f")"

              if [ -f "$d/terra-android/build.gradle" ] \
                && [ -f "$d/terra-android/src/main/cpp/CMakeLists.txt" ] \
                && [ -f "$d/terra-android/src/main/cpp/class_method_executor.cpp" ]; then
                printf '%s\n' "$d"
                return 0
              fi
            done < <(
              find "$root" -maxdepth 12 \
                -name settings.gradle \
                -not -path '*/.git/*' | sort
            )

            return 1
          }

          if PROJECT_DIR="$(find_project_06 .)"; then
            echo "Found extracted SolarCrystal project."
          else
            ZIP_FILE="$(find . -maxdepth 6 -type f \
              -name 'UniverseLauncher-0.6-SolarCrystal-0.6.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::SolarCrystal 0.6 ZIP was not found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            mkdir -p "$RUNNER_TEMP/universe-06-source"

            unzip -q "$ZIP_FILE" \
              -d "$RUNNER_TEMP/universe-06-source"

            if ! PROJECT_DIR="$(find_project_06 \
              "$RUNNER_TEMP/universe-06-source")"; then

              echo "::error::Could not locate the SolarCrystal project structure."

              echo "Extracted ZIP contents:"
              find "$RUNNER_TEMP/universe-06-source" \
                -maxdepth 5 -type f | sort

              exit 1
            fi
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Normalize source timestamps
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -exec touch {} +

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify SolarCrystal 0.6 source files
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/terra-android/src/main/cpp"
          JAVA="$PROJECT_DIR/terra-android/src/main/java"
          GRADLE_FILE="$PROJECT_DIR/terra-android/build.gradle"

          echo "Checking required files..."

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$GRADLE_FILE"
          test -f "$CPP/CMakeLists.txt"
          test -f "$CPP/vm_runtime.cpp"
          test -f "$CPP/class_method_executor.cpp"
          test -f "$CPP/jni_bridge.cpp"
          test -f "$JAVA/com/universe/solarcrystal/NativeBridge.java"
          test -f "$JAVA/com/terra/android/MainActivity.java"

          echo "Checking CMake version..."
          cat "$CPP/CMakeLists.txt"

          if ! grep -Eq 'VERSION[[:space:]]+0\.6\.0' "$CPP/CMakeLists.txt"; then
            echo "::error::CMakeLists.txt does not declare SolarCrystal version 0.6.0."
            exit 1
          fi

          echo "Checking JNI integration..."

          grep -q 'nativeExecuteClassMethodWithArgs' \
            "$CPP/jni_bridge.cpp"

          grep -q 'nativeExecuteClassMethodWithArgs' \
            "$JAVA/com/universe/solarcrystal/NativeBridge.java"

          echo "Checking Android tests..."

          grep -q 'runParameterTest' \
            "$JAVA/com/terra/android/MainActivity.java"

          grep -q 'runMultiplyTest' \
            "$JAVA/com/terra/android/MainActivity.java"

          echo "Checking Android version..."

          if ! grep -Eq "versionName[[:space:]]+['\"]0\.6\.0['\"]" \
            "$GRADLE_FILE"; then
            echo "::error::Android versionName is not 0.6.0."
            exit 1
          fi

          echo "SolarCrystal 0.6 sources verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :terra-android:clean \
            :terra-android:assembleDebug

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" \
              -name '*.apk' -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"

          unzip -l "$APK" | grep 'libsolarcrystal.so'

          ABI_COUNT="$(
            unzip -l "$APK" |
              grep -c 'lib/.*/libsolarcrystal.so' || true
          )"

          if [ "$ABI_COUNT" -ne 4 ]; then
            echo "::error::Expected 4 native ABI libraries, found $ABI_COUNT."
            exit 1
          fi

          echo "All four native ABIs are present."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.6-SolarCrystal-0.6-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
