
name: Build Universe Launcher 0.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o UniverseLauncher-0.2.zip -d extracted
          echo "Archivos extraídos:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate project
        id: locate
        run: |
          APP_BUILD=$(find extracted -type f -path '*/terra-android/build.gradle' -print -quit)

          if [ -z "$APP_BUILD" ]; then
            echo "No se encontró terra-android/build.gradle"
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")
          PROJECT_DIR=$(dirname "$APP_DIR")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Universe Launcher
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.2
          path: extracted/**/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
