name: Build Universe Launcher 0.4 - SolarCrystal VM

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Universe Launcher 0.4 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prefer the actual SolarCrystal 0.4 sources. If only ZIPs are
      # committed, extract the newest matching UniverseLauncher 0.4 archive
      # into a clean directory so an older extracted project cannot win.
      - name: Locate SolarCrystal 0.4 project
        shell: bash
        run: |
          set -euo pipefail

          is_v04_project() {
            local d="$1"
            [ -f "$d/settings.gradle" ] &&
            [ -f "$d/terra-android/build.gradle" ] &&
            [ -f "$d/terra-android/src/main/cpp/CMakeLists.txt" ] &&
            [ -f "$d/terra-android/src/main/cpp/class_reader.cpp" ] &&
            [ -f "$d/terra-android/src/main/cpp/vm_runtime.cpp" ] &&
            [ -f "$d/terra-android/src/main/cpp/include/vm_runtime.h" ] &&
            grep -q 'vm_runtime.cpp' "$d/terra-android/src/main/cpp/CMakeLists.txt" &&
            grep -q 'nativeExecuteBytecode' "$d/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
          }

          PROJECT_DIR=""

          # First search checked-in source directories for a complete 0.4 tree.
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if is_v04_project "$candidate"; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -maxdepth 7 -name settings.gradle -not -path './.git/*' | sort)

          # If sources are not expanded in the repository, extract a matching ZIP.
          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p "$RUNNER_TEMP/universe-04-source"
            FOUND_ZIP=""

            while IFS= read -r archive; do
              if unzip -tq "$archive" >/dev/null 2>&1 &&
                 unzip -Z1 "$archive" | grep -qE '(^|/)terra-android/src/main/cpp/vm_runtime\.cpp$' &&
                 unzip -Z1 "$archive" | grep -qE '(^|/)terra-android/src/main/cpp/include/vm_runtime\.h$'; then
                FOUND_ZIP="$archive"
                break
              fi
            done < <(find . -maxdepth 4 -type f -name 'UniverseLauncher-0.4-SolarCrystal-0.4.zip' | sort)

            if [ -z "$FOUND_ZIP" ]; then
              echo "::error::Could not find SolarCrystal 0.4 source files or UniverseLauncher-0.4-SolarCrystal-0.4.zip."
              exit 1
            fi

            echo "Extracting $FOUND_ZIP"
            unzip -q "$FOUND_ZIP" -d "$RUNNER_TEMP/universe-04-source"

            while IFS= read -r settings; do
              candidate="$(dirname "$settings")"
              if is_v04_project "$candidate"; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$RUNNER_TEMP/universe-04-source" -maxdepth 9 -name settings.gradle | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::The selected archive does not contain a complete SolarCrystal 0.4 project."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"
          echo "SolarCrystal CMake sources:"
          grep -nE 'solarcrystal.cpp|class_reader.cpp|vm_runtime.cpp|jni_bridge.cpp' \
            "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt"

      - name: Verify version and JNI integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VERSION 0.4.0' "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt"
          grep -q "versionName '0.4.0'" "$PROJECT_DIR/terra-android/build.gradle"
          grep -q 'nativeInspectClass' "$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
          grep -q 'nativeExecuteBytecode' "$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
          grep -q 'vm_runtime.cpp' "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt"
          echo "SolarCrystal 0.4 source checks passed."

      - name: Normalize source timestamps
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -exec touch {} +
          echo "Source timestamps normalized."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :terra-android:clean \
            :terra-android:assembleDebug

      - name: Verify APK and SolarCrystal native library
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/[^/]+/libsolarcrystal\.so$'

          ABI_COUNT="$(unzip -l "$APK" | grep -cE 'lib/[^/]+/libsolarcrystal\.so$' || true)"
          if [ "$ABI_COUNT" -lt 1 ]; then
            echo "::error::libsolarcrystal.so is missing from the APK."
            exit 1
          fi

          echo "APK verification passed ($ABI_COUNT ABI libraries found)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.4-SolarCrystal-0.4-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
