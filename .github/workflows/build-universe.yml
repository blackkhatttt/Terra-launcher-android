name: Build Universe Launcher 0.6 - SolarCrystal

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Universe Launcher 0.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate SolarCrystal 0.6 project
        shell: bash
        run: |
          set -euo pipefail

          find_project_06() {
            local f d

            while IFS= read -r f; do
              d="$(dirname "$f")"

              if [ -f "$d/terra-android/build.gradle" ] \
                && [ -f "$d/terra-android/src/main/cpp/class_method_executor.cpp" ] \
                && grep -q 'VERSION 0.6.0' "$d/terra-android/src/main/cpp/CMakeLists.txt"; then
                echo "$d"
                return 0
              fi
            done < <(
              find "$1" -maxdepth 7 \
                -name settings.gradle \
                -not -path '*/.git/*' \
                | sort
            )

            return 1
          }

          if ! PROJECT_DIR="$(find_project_06 .)"; then
            echo "::error::SolarCrystal 0.6 project not found."
            echo "Upload the complete 0.6 source project to the repository."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using project: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Normalize source timestamps
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -exec touch {} +

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify SolarCrystal 0.6 source files
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/terra-android/src/main/cpp"
          JAVA="$PROJECT_DIR/terra-android/src/main/java"

          test -f "$CPP/vm_runtime.cpp"
          test -f "$CPP/class_method_executor.cpp"
          test -f "$CPP/jni_bridge.cpp"

          grep -q 'VERSION 0.6.0' "$CPP/CMakeLists.txt"

          grep -q 'nativeExecuteClassMethodWithArgs' \
            "$CPP/jni_bridge.cpp"

          grep -q 'nativeExecuteClassMethodWithArgs' \
            "$JAVA/com/universe/solarcrystal/NativeBridge.java"

          grep -q 'runParameterTest' \
            "$JAVA/com/terra/android/MainActivity.java"

          grep -q 'runMultiplyTest' \
            "$JAVA/com/terra/android/MainActivity.java"

          grep -q "versionName '0.6.0'" \
            "$PROJECT_DIR/terra-android/build.gradle"

          echo "SolarCrystal 0.6 sources verified."

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :terra-android:clean \
            :terra-android:assembleDebug

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/terra-android/build/outputs/apk/debug" \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          echo "APK: $APK"

          unzip -l "$APK" | grep 'libsolarcrystal.so'

          ABI_COUNT="$(
            unzip -l "$APK" \
              | grep -c 'lib/.*/libsolarcrystal.so'
          )"

          if [ "$ABI_COUNT" -ne 4 ]; then
            echo "::error::Expected 4 native ABI libraries, found $ABI_COUNT"
            exit 1
          fi

          echo "All four native ABIs are present."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.6-SolarCrystal-0.6-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
