
name: Build Universe Launcher 0.6 - SolarCrystal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: 8.10.2
      ANDROID_NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find SolarCrystal 0.6 project
        shell: bash
        run: |
          set -e

          find_project() {
            while IFS= read -r settings_file; do
              candidate="$(dirname "$settings_file")"

              if [ -f "$candidate/terra-android/build.gradle" ] &&
                 [ -f "$candidate/terra-android/src/main/cpp/CMakeLists.txt" ] &&
                 [ -f "$candidate/terra-android/src/main/cpp/class_method_executor.cpp" ] &&
                 [ -f "$candidate/terra-core/build.gradle" ]; then
                echo "$candidate"
                return 0
              fi
            done < <(find . -type f -name settings.gradle \
              -not -path './.git/*' \
              -not -path '*/build/*')

            return 1
          }

          PROJECT_DIR="$(find_project || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="UniverseLauncher-0.6-SolarCrystal-0.6.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ERROR: SolarCrystal 0.6 project and ZIP were not found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/universe-06-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/universe-06-source"

            cd "$RUNNER_TEMP/universe-06-source"

            PROJECT_DIR="$(find_project || true)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: The ZIP does not contain a valid SolarCrystal 0.6 project."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Validate SolarCrystal 0.6 files
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/terra-android/build.gradle"
          test -f "$PROJECT_DIR/terra-core/build.gradle"

          test -f "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt"
          test -f "$PROJECT_DIR/terra-android/src/main/cpp/vm_runtime.cpp"
          test -f "$PROJECT_DIR/terra-android/src/main/cpp/class_method_executor.cpp"
          test -f "$PROJECT_DIR/terra-android/src/main/cpp/jni_bridge.cpp"

          test -f "$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java"
          test -f "$PROJECT_DIR/terra-android/src/main/java/com/terra/android/MainActivity.java"

          echo "Checking Gradle version..."

          if ! grep -Eq "versionName[[:space:]]+['\"]0\.6\.0['\"]" \
            "$PROJECT_DIR/terra-android/build.gradle"; then
            echo "ERROR: versionName 0.6.0 was not found in terra-android/build.gradle."
            exit 1
          fi

          echo "SolarCrystal 0.6 validation passed."

          echo "CMakeLists.txt was found."
          echo "No CMake version label is required."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Universe Launcher
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version

          gradle \
            --no-daemon \
            :terra-android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/terra-android/build/outputs/apk/debug/terra-android-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

          echo "Checking native libraries..."

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libsolarcrystal.so"; then
              echo "OK: $ABI"
            else
              echo "ERROR: Missing native library for $ABI"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-0.6-SolarCrystal-0.6-Android
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/terra-android-debug.apk
          if-no-files-found: error
