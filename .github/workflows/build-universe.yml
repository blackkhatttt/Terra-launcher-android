name: Build Universe Launcher Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10.2'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          find_project() {
            local root="$1"
            while IFS= read -r settings; do
              local dir
              dir="$(dirname "$settings")"
              if [ -f "$dir/terra-android/build.gradle" ] &&
                 [ -f "$dir/terra-core/build.gradle" ] &&
                 [ -f "$dir/terra-android/src/main/cpp/CMakeLists.txt" ] &&
                 [ -f "$dir/terra-android/src/main/cpp/jni_bridge.cpp" ] &&
                 [ -f "$dir/terra-android/src/main/java/com/universe/solarcrystal/NativeBridge.java" ] &&
                 [ -f "$dir/terra-android/src/main/java/com/terra/android/MainActivity.java" ]; then
                printf '%s\n' "$dir"
                return 0
              fi
            done < <(find "$root" -maxdepth 8 -type f -name settings.gradle -not -path '*/.git/*' | sort)
            return 1
          }

          if ! PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE")"; then
            ZIP_FILE="$GITHUB_WORKSPACE/UniverseLauncher-0.7-SolarCrystal-0.7.zip"
            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::No valid Android project or supported source ZIP was found."
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/universe-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
            PROJECT_DIR="$(find_project "$EXTRACT_DIR")" || {
              echo "::error::The source ZIP does not contain the required Android project files."
              exit 1
            }
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Validate source files and report declared versions
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/terra-android/src/main/cpp"
          JAVA="$PROJECT_DIR/terra-android/src/main/java"
          for file in \
            "$CPP/CMakeLists.txt" \
            "$CPP/vm_runtime.cpp" \
            "$CPP/jni_bridge.cpp" \
            "$JAVA/com/universe/solarcrystal/NativeBridge.java" \
            "$JAVA/com/terra/android/MainActivity.java"; do
            test -f "$file"
            echo "OK: $file"
          done
          echo "Gradle version declaration (informational):"
          grep -E 'versionCode|versionName' "$PROJECT_DIR/terra-android/build.gradle" || true
          echo "CMake project declaration (informational):"
          grep -E '^project\(' "$CPP/CMakeLists.txt" || true
          echo "Version labels are informational; they are not build failure conditions."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Clean build directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/terra-android/.cxx"
          rm -rf "$PROJECT_DIR/terra-android/build"
          rm -rf "$PROJECT_DIR/terra-android/.externalNativeBuild"
          rm -rf "$PROJECT_DIR/terra-core/build"

      - name: Build Universe Launcher
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :terra-android:assembleDebug

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/terra-android/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle did not generate an APK."
            exit 1
          fi
          APK_DIR="$RUNNER_TEMP/universe-apk-check"
          mkdir -p "$APK_DIR"
          unzip -q "$APK" -d "$APK_DIR"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "$APK_DIR/lib/$ABI/libsolarcrystal.so"
            echo "OK: libsolarcrystal.so ($ABI)"
          done
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-Android
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
