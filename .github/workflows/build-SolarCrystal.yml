
name: Build SolarCrystal Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SolarCrystal
        run: |
          unzip -o SolarCrystal-0.1.zip -d extracted
          echo "Contenido extraído:"
          find extracted -maxdepth 5 -type f -name "settings.gradle" -print

      - name: Locate Android project
        id: locate
        run: |
          ANDROID_DIR=$(dirname "$(find extracted -type f -path '*/android/settings.gradle' -print -quit)")

          if [ -z "$ANDROID_DIR" ] || [ ! -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "No se encontró el proyecto Android."
            find extracted -maxdepth 5 -type d
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado: $ANDROID_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.android_dir }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarCrystal-Android
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
