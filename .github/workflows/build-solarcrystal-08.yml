name: Build Universe Launcher 0.8.6a - class-file model

on:
  workflow_dispatch:
  push:
    branches:
      - solarcrystal-0.8

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10.2'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build and verify SolarCrystal 0.8.6a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0.8 branch
        uses: actions/checkout@v4

      - name: Extract SolarCrystal 0.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/UniverseLauncher-0.7-SolarCrystal-0.7.zip"
          test -f "$ZIP"
          mkdir -p "$RUNNER_TEMP/sc08"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/sc08"
          PROJECT="$(find "$RUNNER_TEMP/sc08" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          test -n "$PROJECT"
          test -f "$PROJECT/terra-android/build.gradle"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "SolarCrystal source: $PROJECT"
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_082.py"
          grep -q "case 0x70:" terra-android/src/main/cpp/vm_runtime.cpp
          echo "SolarCrystal 0.8.2 integer opcodes integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_083.py"
          grep -q "case 0xb8:" terra-android/src/main/cpp/vm_runtime.cpp
          grep -q "invokestatic_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.3b invokestatic runtime integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084.py"
          grep -q "object_heap.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4 object heap integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084b.py"
          grep -q "vm_value.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4b tagged VM values integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084c.py"
          grep -q "reference_bytecode_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4c reference bytecode executor integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_086a.py"
          grep -q "class_file_model.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.6a class-file model integrated."

      - name: Test SolarCrystal object heap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/tests/native/object_heap_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084/object_heap_test"
          "$RUNNER_TEMP/sc084/object_heap_test"

      - name: Test SolarCrystal typed VM values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084b"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/tests/native/vm_value_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084b/vm_value_test"
          "$RUNNER_TEMP/sc084b/vm_value_test"

      - name: Test SolarCrystal reference bytecodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084c"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/tests/native/reference_bytecode_executor_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084c/reference_bytecode_test"
          "$RUNNER_TEMP/sc084c/reference_bytecode_test"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Test SolarCrystal class-file model 0.8.6a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc086a/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc086a/classes" solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/tests/native/class_file_model_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc086a/class_file_model_test"
          "$RUNNER_TEMP/sc086a/class_file_model_test" "$RUNNER_TEMP/sc086a/classes/SolarCrystalObjectFixture.class"

      - name: Integrate SolarCrystal 0.8 JAR and class loaders
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal"
          mkdir -p "$DEST"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/JarArchiveReader.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/ClassFileLoader.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/ClassFileInspector.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/JarClassLoadingTest.java "$DEST/"
          grep -q "class JarArchiveReader" "$DEST/JarArchiveReader.java"
          grep -q "class ClassFileLoader" "$DEST/ClassFileLoader.java"
          grep -q "class ClassFileInspector" "$DEST/ClassFileInspector.java"
          grep -q "class JarClassLoadingTest" "$DEST/JarClassLoadingTest.java"

          FIXTURE="$GITHUB_WORKSPACE/solarcrystal-0.8/tests/jar-fixture"
          mkdir -p "$RUNNER_TEMP/sc08-fixture/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc08-fixture/classes" "$FIXTURE/SolarCrystalJarFixture.java"
          ASSETS="$PROJECT_DIR/terra-android/src/main/assets"
          mkdir -p "$ASSETS"
          jar --create --file "$ASSETS/solarcrystal-smoke-test.jar" -C "$RUNNER_TEMP/sc08-fixture/classes" .

          cd "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_jar_test.py"
          grep -q "JarClassLoadingTest.run(this)" terra-android/src/main/java/com/terra/android/MainActivity.java
          sed -i "s/versionCode 7/versionCode 8/" "$PROJECT_DIR/terra-android/build.gradle"
          sed -i "s/versionName ['\"]0.7.0['\"]/versionName '0.8.6a'/" "$PROJECT_DIR/terra-android/build.gradle"
          sed -i "s/VERSION 0.7/VERSION 0.8.6a/" "$PROJECT_DIR/terra-android/src/main/java/com/terra/android/MainActivity.java"
          sed -i "s/SOLARCRYSTAL 0.7/SOLARCRYSTAL 0.8.6a/" "$PROJECT_DIR/terra-android/src/main/java/com/terra/android/MainActivity.java"
          echo "JAR reader, class inspector and reference constructor runtime integrated."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          BUILD_OK=0
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if gradle --no-daemon --refresh-dependencies --stacktrace :terra-android:assembleDebug; then
              BUILD_OK=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt failed; waiting before retry..."
              sleep 20
            fi
          done
          test "$BUILD_OK" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Launcher-SolarCrystal-0.8.6a
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
