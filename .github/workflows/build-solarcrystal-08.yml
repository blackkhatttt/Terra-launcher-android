name: Build Universe Launcher 0.9.11 - First-Person Voxel Exploration
# Keep Java string escapes intact in the 0.9.8 Android integration.
# Retry after making legacy Gradle version normalization tolerant of multiple declarations.

on:
  workflow_dispatch:
  push:
    branches:
      - solarcrystal-0.8

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10.2'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build and verify SolarCrystal 0.9.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0.8 branch
        uses: actions/checkout@v4

      - name: Extract SolarCrystal 0.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/UniverseLauncher-0.7-SolarCrystal-0.7.zip"
          test -f "$ZIP"
          mkdir -p "$RUNNER_TEMP/sc08"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/sc08"
          PROJECT="$(find "$RUNNER_TEMP/sc08" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          test -n "$PROJECT"
          test -f "$PROJECT/terra-android/build.gradle"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "SolarCrystal source: $PROJECT"
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_082.py"
          grep -q "case 0x70:" terra-android/src/main/cpp/vm_runtime.cpp
          echo "SolarCrystal 0.8.2 integer opcodes integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_083.py"
          grep -q "case 0xb8:" terra-android/src/main/cpp/vm_runtime.cpp
          grep -q "invokestatic_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.3b invokestatic runtime integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084.py"
          grep -q "object_heap.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4 object heap integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084b.py"
          grep -q "vm_value.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4b tagged VM values integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_084c.py"
          grep -q "reference_bytecode_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.4c reference bytecode executor integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_086a.py"
          grep -q "class_file_model.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.6a class-file model integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_086b.py"
          grep -q "class_file_execution_resolver.cpp" terra-android/src/main/cpp/CMakeLists.txt
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_086c.py"
          grep -q "class_file_repository.cpp" terra-android/src/main/cpp/CMakeLists.txt
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_086d.py"
          grep -q "class_file_method_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.6d parsed method executor integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_087a.py"
          grep -q "class_dependency_analyzer.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.7a dependency analyzer integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_087b.py"
          grep -q "find_inherited_field" terra-android/src/main/cpp/class_file_execution_resolver.cpp
          echo "SolarCrystal 0.8.7b inherited fields integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_087c.py"
          grep -q "class_method_resolver.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.7c inherited methods and interfaces integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_087d.py"
          grep -q "class_file_linkage_resolver.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.7d multi-class member linkage integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_088a.py"
          grep -q "array_bytecode_executor.cpp" terra-android/src/main/cpp/CMakeLists.txt
          echo "SolarCrystal 0.8.8a array runtime integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_088b.py"
          grep -q "MinecraftPreviewActivity" terra-android/src/main/AndroidManifest.xml
          grep -q "OPEN FIRST MINECRAFT GRAPHICS" terra-android/src/main/java/com/terra/android/MainActivity.java
          grep -q "glDrawArrays" terra-android/src/main/java/com/terra/android/MinecraftPreviewRenderer.java
          echo "SolarCrystal 0.8.8b OpenGL ES first graphics preview integrated."
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_vm_088c.py"
          grep -q "glDrawArrays" terra-android/src/main/java/com/terra/android/MinecraftPreviewRenderer.java
          grep -q "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" terra-android/src/main/java/com/terra/android/MinecraftPreviewActivity.java
          echo "SolarCrystal 0.8.8c optimized fullscreen voxel preview integrated."

      - name: Test SolarCrystal object heap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/tests/native/object_heap_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084/object_heap_test"
          "$RUNNER_TEMP/sc084/object_heap_test"

      - name: Test SolarCrystal typed VM values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084b"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/tests/native/vm_value_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084b/vm_value_test"
          "$RUNNER_TEMP/sc084b/vm_value_test"

      - name: Test SolarCrystal reference bytecodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc084c"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/tests/native/reference_bytecode_executor_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc084c/reference_bytecode_test"
          "$RUNNER_TEMP/sc084c/reference_bytecode_test"

      - name: Test SolarCrystal array heap and bytecodes 0.8.8a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc088a"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/vm_array_heap.cpp \
            solarcrystal-0.8/native/array_bytecode_executor.cpp \
            solarcrystal-0.8/tests/native/vm_array_heap_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc088a/vm_array_heap_test"
          "$RUNNER_TEMP/sc088a/vm_array_heap_test"

      - name: Test SolarCrystal core Java library registry 0.8.10a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc0810a"
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/core_library_registry.cpp \
            solarcrystal-0.8/tests/native/core_library_registry_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc0810a/core_library_registry_test"
          "$RUNNER_TEMP/sc0810a/core_library_registry_test"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Test SolarCrystal Java exception tables 0.8.9a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc089a/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc089a/classes" solarcrystal-0.8/tests/jar-fixture/SolarCrystalExceptionFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/tests/native/class_file_exception_table_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc089a/class_file_exception_table_test"
          "$RUNNER_TEMP/sc089a/class_file_exception_table_test" "$RUNNER_TEMP/sc089a/classes/SolarCrystalExceptionFixture.class"

      - name: Test SolarCrystal static field metadata 0.8.9b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc089b/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc089b/classes" solarcrystal-0.8/tests/jar-fixture/SolarCrystalStaticFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/tests/native/class_file_static_metadata_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc089b/class_file_static_metadata_test"
          "$RUNNER_TEMP/sc089b/class_file_static_metadata_test" "$RUNNER_TEMP/sc089b/classes/SolarCrystalStaticFixture.class"

      - name: Test SolarCrystal class-file model 0.8.6a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc086a/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc086a/classes" solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/tests/native/class_file_model_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc086a/class_file_model_test"
          "$RUNNER_TEMP/sc086a/class_file_model_test" "$RUNNER_TEMP/sc086a/classes/SolarCrystalObjectFixture.class"

      - name: Test SolarCrystal Constant Pool execution 0.8.6b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc086b/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc086b/classes" solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_file_execution_resolver.cpp \
            solarcrystal-0.8/tests/native/class_file_execution_resolver_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc086b/class_file_execution_resolver_test"
          "$RUNNER_TEMP/sc086b/class_file_execution_resolver_test" "$RUNNER_TEMP/sc086b/classes/SolarCrystalObjectFixture.class"

      - name: Test SolarCrystal multi-class resolution 0.8.6d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc086c/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc086c/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalSecondaryFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_file_execution_resolver.cpp \
            solarcrystal-0.8/tests/native/class_file_repository_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc086c/class_file_repository_test"
          "$RUNNER_TEMP/sc086c/class_file_repository_test" \
            "$RUNNER_TEMP/sc086c/classes/SolarCrystalObjectFixture.class" \
            "$RUNNER_TEMP/sc086c/classes/SolarCrystalSecondaryFixture.class"

      - name: Test SolarCrystal parsed method execution 0.8.6d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc086d/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc086d/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalSecondaryFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_file_execution_resolver.cpp \
            solarcrystal-0.8/native/class_file_method_executor.cpp \
            solarcrystal-0.8/tests/native/class_file_method_executor_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc086d/class_file_method_executor_test"
          "$RUNNER_TEMP/sc086d/class_file_method_executor_test" \
            "$RUNNER_TEMP/sc086d/classes/SolarCrystalObjectFixture.class" \
            "$RUNNER_TEMP/sc086d/classes/SolarCrystalSecondaryFixture.class"

      - name: Test SolarCrystal class dependency analysis 0.8.7b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc087a/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc087a/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalObjectFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalSecondaryFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMarkerFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMissingFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalDependencyFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_dependency_analyzer.cpp \
            solarcrystal-0.8/tests/native/class_dependency_analyzer_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc087a/class_dependency_analyzer_test"
          "$RUNNER_TEMP/sc087a/class_dependency_analyzer_test" \
            "$RUNNER_TEMP/sc087a/classes/SolarCrystalSecondaryFixture.class" \
            "$RUNNER_TEMP/sc087a/classes/SolarCrystalMarkerFixture.class" \
            "$RUNNER_TEMP/sc087a/classes/SolarCrystalDependencyFixture.class"

      - name: Test SolarCrystal inherited integer fields 0.8.7b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc087b/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc087b/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalInheritedBaseFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalInheritedChildFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/object_heap.cpp \
            solarcrystal-0.8/native/vm_value.cpp \
            solarcrystal-0.8/native/reference_bytecode_executor.cpp \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_file_execution_resolver.cpp \
            solarcrystal-0.8/tests/native/inherited_field_resolution_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc087b/inherited_field_resolution_test"
          "$RUNNER_TEMP/sc087b/inherited_field_resolution_test" \
            "$RUNNER_TEMP/sc087b/classes/SolarCrystalInheritedBaseFixture.class" \
            "$RUNNER_TEMP/sc087b/classes/SolarCrystalInheritedChildFixture.class"

      - name: Test SolarCrystal inherited methods and interfaces 0.8.7c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc087c/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc087c/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMethodBaseFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalDefaultInterfaceFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMethodChildFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_method_resolver.cpp \
            solarcrystal-0.8/tests/native/class_method_resolver_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc087c/class_method_resolver_test"
          "$RUNNER_TEMP/sc087c/class_method_resolver_test" \
            "$RUNNER_TEMP/sc087c/classes/SolarCrystalMethodBaseFixture.class" \
            "$RUNNER_TEMP/sc087c/classes/SolarCrystalMethodChildFixture.class" \
            "$RUNNER_TEMP/sc087c/classes/SolarCrystalDefaultInterfaceFixture.class"

      - name: Test SolarCrystal multi-class member linkage 0.8.7d (javac-compatible)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc087d/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc087d/classes" \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMethodBaseFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalDefaultInterfaceFixture.java \
            solarcrystal-0.8/tests/jar-fixture/SolarCrystalMethodChildFixture.java
          g++ -std=c++17 -Wall -Wextra -Werror \
            solarcrystal-0.8/native/class_file_model.cpp \
            solarcrystal-0.8/native/class_file_repository.cpp \
            solarcrystal-0.8/native/class_method_resolver.cpp \
            solarcrystal-0.8/native/class_file_linkage_resolver.cpp \
            solarcrystal-0.8/tests/native/class_file_linkage_resolver_test.cpp \
            -I solarcrystal-0.8/native \
            -o "$RUNNER_TEMP/sc087d/class_file_linkage_resolver_test"
          "$RUNNER_TEMP/sc087d/class_file_linkage_resolver_test" \
            "$RUNNER_TEMP/sc087d/classes/SolarCrystalMethodBaseFixture.class" \
            "$RUNNER_TEMP/sc087d/classes/SolarCrystalMethodChildFixture.class" \
            "$RUNNER_TEMP/sc087d/classes/SolarCrystalDefaultInterfaceFixture.class"

      - name: Integrate SolarCrystal 0.8 JAR and class loaders
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/terra-android/src/main/java/com/universe/solarcrystal"
          mkdir -p "$DEST"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/JarArchiveReader.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/ClassFileLoader.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/ClassFileInspector.java "$DEST/"
          cp solarcrystal-0.8/src/main/java/com/universe/solarcrystal/JarClassLoadingTest.java "$DEST/"
          grep -q "class JarArchiveReader" "$DEST/JarArchiveReader.java"
          grep -q "class ClassFileLoader" "$DEST/ClassFileLoader.java"
          grep -q "class ClassFileInspector" "$DEST/ClassFileInspector.java"
          grep -q "class JarClassLoadingTest" "$DEST/JarClassLoadingTest.java"

          FIXTURE="$GITHUB_WORKSPACE/solarcrystal-0.8/tests/jar-fixture"
          mkdir -p "$RUNNER_TEMP/sc08-fixture/classes"
          javac --release 8 -g:none -d "$RUNNER_TEMP/sc08-fixture/classes" "$FIXTURE/SolarCrystalJarFixture.java"
          ASSETS="$PROJECT_DIR/terra-android/src/main/assets"
          mkdir -p "$ASSETS"
          jar --create --file "$ASSETS/solarcrystal-smoke-test.jar" -C "$RUNNER_TEMP/sc08-fixture/classes" .

          cd "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/solarcrystal-0.8/tools/integrate_jar_test.py"
          grep -q "JarClassLoadingTest.run(this)" terra-android/src/main/java/com/terra/android/MainActivity.java
          python3 - "$PROJECT_DIR/terra-android/build.gradle" "$PROJECT_DIR/terra-android/src/main/cpp/CMakeLists.txt" <<'PY'
          import sys
          from pathlib import Path

          gradle_path = Path(sys.argv[1])
          gradle_lines = gradle_path.read_text(encoding="utf-8").splitlines()
          code_count = 0
          name_count = 0
          for index, line in enumerate(gradle_lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode "):
                  gradle_lines[index] = indent + "versionCode 8"
                  code_count += 1
              elif stripped.startswith("versionName "):
                  gradle_lines[index] = indent + "versionName '0.8.8a'"
                  name_count += 1
          if code_count < 1 or name_count < 1:
              raise SystemExit(
                  "Could not find Android versionCode/versionName "
                  f"(versionCode declarations: {code_count}, versionName declarations: {name_count})"
              )
          gradle_path.write_text("\n".join(gradle_lines) + "\n", encoding="utf-8")
          print(
              "Android version declarations normalized to 0.8.8a "
              f"(updated {code_count} versionCode and {name_count} versionName entries)."
          )

          cmake_path = Path(sys.argv[2])
          cmake_lines = cmake_path.read_text(encoding="utf-8").splitlines()
          cmake_updated = False
          marker = "project(SolarCrystal VERSION "
          for index, line in enumerate(cmake_lines):
              if marker not in line:
                  continue
              prefix, suffix = line.split(marker, 1)
              current_version = suffix.split()[0]
              version_parts = current_version.split(".")
              if len(version_parts) == 3 and all(part.isdigit() for part in version_parts):
                  cmake_lines[index] = prefix + marker + "0.8.7" + suffix[len(current_version):]
                  cmake_updated = True
                  break
          if cmake_updated:
              cmake_path.write_text("\n".join(cmake_lines) + "\n", encoding="utf-8")
