      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          BUILD_OK=0
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if gradle --no-daemon --refresh-dependencies --stacktrace :terra-android:assembleDebug; then
              BUILD_OK=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt failed; waiting before retry..."
              sleep 20
            fi
          done
          test "$BUILD_OK" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Launcher-SolarCrystal-0.8.9c
          path: ${{ env.PROJECT_DIR }}/terra-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
